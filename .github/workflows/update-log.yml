name: Update Workout Log

on:
  push:
    paths:
      - "workouts/**.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-log
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build index.html
        run: python3 build.py

      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "chore: update workout log" && git pull --rebase origin ${{ github.ref_name }} && git push)
